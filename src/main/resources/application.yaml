server:
  port: ${PROFILE_SERVICE_PORT:8082}
  forward-headers-strategy: none
spring:
  application:
    name: profile-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
balaio:
  auth:
    jwt:
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
