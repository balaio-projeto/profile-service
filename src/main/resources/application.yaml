server:
  port: ${PROFILE_SERVICE_PORT:8082}
  forward-headers-strategy: none
  tomcat:
    # Drain a bounded rejected body so the client can receive the HTTP 413.
    # Accepted uploads remain limited to 2 MiB/file and 3 MiB/request below.
    max-swallow-size: 4MB
spring:
  application:
    name: profile-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
      file-size-threshold: 0B
      resolve-lazily: true
  mail:
    host: ${PROFILE_SMTP_HOST:localhost}
    port: ${PROFILE_SMTP_PORT:1025}
    username: ${PROFILE_SMTP_USERNAME:}
    password: ${PROFILE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${PROFILE_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${PROFILE_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${PROFILE_SMTP_STARTTLS:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.debug: false
      mail.smtp.connectiontimeout: ${PROFILE_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${PROFILE_SMTP_READ_TIMEOUT:10000}
      mail.smtp.writetimeout: ${PROFILE_SMTP_WRITE_TIMEOUT:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
recovery:
  frontend-base-url: ${PROFILE_FRONTEND_BASE_URL:http://localhost:4321}
  from: ${PROFILE_MAIL_FROM:nao-responda@localhost}
  token-ttl: ${PROFILE_RECOVERY_TOKEN_TTL:PT1H}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
balaio:
  internal-token: ${BALAIO_INTERNAL_TOKEN:}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  auth:
    jwt:
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
